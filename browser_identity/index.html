<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
<script>
const KEY='amazon_visitor_v2';
const TTL_MS=90*24*60*60*1000;
function parentOrigin(){
  try{return document.referrer?new URL(document.referrer).origin:'*';}catch(e){return '*';}
}
function send(type,extra={}){
  window.parent.postMessage({isStreamlitMessage:true,type,...extra},parentOrigin());
}
function getIdentity(){
  const now=Date.now();
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed&&typeof parsed.id==='string'&&Number(parsed.created)>0&&now-Number(parsed.created)<TTL_MS){
        return parsed.id;
      }
    }
    const id=crypto.randomUUID();
    localStorage.setItem(KEY,JSON.stringify({id,created:now}));
    return id;
  }catch(e){
    return null;
  }
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;
  const id=getIdentity();
  send('streamlit:setComponentValue',{value:id,dataType:'json'});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script>
</body>
</html>
